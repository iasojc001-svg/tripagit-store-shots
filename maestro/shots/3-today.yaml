# 11-14: 예약 탭 맨 위 '오늘의 예약'(귀국 비행기) → 눌러 크게. 한국 시간 16:40 전에만 뜬다(자료: 오늘 = 도쿄 마지막 날)
appId: com.tripagit.app
---
- launchApp
- extendedWaitUntil: { visible: "도쿄 4박5일|Tokyo, 5 days", timeout: 40000 }
- tapOn: { text: "닫기|Close", optional: true }
- tapOn: "도쿄 4박5일|Tokyo, 5 days"
- extendedWaitUntil: { visible: "나리타 공항 출발|Depart from Narita|호텔 체크아웃|Hotel check-out", timeout: 30000 }
- takeScreenshot: raw-31-today-sched
- tapOn: "예약|Bookings"
- extendedWaitUntil: { visible: "오늘의 예약.*|Today's bookings.*", timeout: 20000 }
- waitForAnimationToEnd: { timeout: 4000 }
- takeScreenshot: raw-32-today-card
- tapOn: "K7Q2MD"
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: raw-33-today-big
